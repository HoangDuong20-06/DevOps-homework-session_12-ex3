name: CD Multi Env (Staging & Production)

# Kích hoạt khi push vào develop (staging) hoặc main (production)
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy-staging:
    # Chỉ chạy khi push vào nhánh develop
    if: github.ref == 'refs/heads/develop'
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api.staging.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying branch ${{ github.ref_name }} (commit ${{ github.sha }}) to STAGING..."
          echo "Target URL: https://api.staging.example.com"
          echo "✅ Staging deployment succeeded!"

  deploy-prod:
    # Chỉ chạy khi push vào nhánh main
    if: github.ref == 'refs/heads/main'
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying branch ${{ github.ref_name }} (commit ${{ github.sha }}) to PRODUCTION..."
          echo "Target URL: https://api.prod.example.com"
          echo "✅ Production deployment succeeded!"
